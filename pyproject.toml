[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".deps", "node_modules", "tmp", "instance"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["procurement/inputs.py", "procurement/operations.py", "procurement/workflow.py", "procurement/purchasing.py", "procurement/receiving.py", "procurement/extraction.py", "procurement/models.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: browser regression tests using a running seeded application"]
