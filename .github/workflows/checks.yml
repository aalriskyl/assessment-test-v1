name: Procurement checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: procure_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: procure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U procure_test -d procure_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test && npm run format:check
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check procurement tests run.py migrations
      - run: ruff format --check procurement tests run.py migrations
      - run: mypy --config-file pyproject.toml
      - name: Run regression suite
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://procure_test:test-only-password@localhost:5432/procure_test' || '' }}
        run: pytest tests/test_v4.py -q --junitxml=test-results/regression.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-${{ matrix.database }}
          path: test-results/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python run.py seed-demo
      - name: Start local server
        run: |
          python run.py serve > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/login > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run browser regressions
        env:
          E2E_BASE_URL: http://127.0.0.1:5000
        run: pytest tests/test_browser.py --tracing retain-on-failure --screenshot only-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            server.log
